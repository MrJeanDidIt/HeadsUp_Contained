# Do not commit the real version. Create it out of band:
#
#   kubectl -n apps create secret generic heads-up-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#     --from-literal=CANVAS_TOKEN='...' \
#     --from-literal=NTFY_TOPIC='...'
#
# Or adopt sealed-secrets so the encrypted form can live in Git.
apiVersion: v1
kind: Secret
metadata:
  name: heads-up-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://headsup:CHANGEME@postgres:5432/headsup"
  REDIS_URL: "redis://redis:6379/0"
  CANVAS_TOKEN: "CHANGEME"
  NTFY_TOPIC: "CHANGEME"
  ENTRA_TENANT_ID: "CHANGEME"
  ENTRA_AUDIENCE: "api://heads-up"
