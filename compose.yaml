services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: headsup
      POSTGRES_PASSWORD: headsup
      POSTGRES_DB: headsup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headsup"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: ghcr.io/mrjeandidit/heads-up:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://headsup:headsup@db:5432/headsup
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
